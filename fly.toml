# Uyimiz.uz backend — Fly.io konfiguratsiyasi
# App nomini o'zingiznikiga almashtiring: `fly launch --no-deploy` avtomatik to'ldiradi.

app = "uyimiz-backend"
primary_region = "fra"   # Toshkentga eng yaqin: fra (Frankfurt) yoki cdg

[build]

[deploy]
  # Har deploy'dan oldin migratsiyalar ishga tushadi
  release_command = "python manage.py migrate --noinput"

[env]
  DJANGO_DEBUG = "0"
  DJANGO_DB_SSL = "0"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
