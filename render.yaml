# Uyimiz.uz backend — Render Blueprint
# Dashboard → Blueprints → New Blueprint Instance → shu repo'ni tanlang.
# Yoki servis allaqachon yaratilgan bo'lsa, quyidagi qiymatlarni
# Settings/Environment bo'limiga qo'lda kiriting.

databases:
  - name: uyimiz-db
    databaseName: uyimiz
    user: uyimiz
    plan: basic-256mb        # bepul sinov uchun: free
    region: frankfurt

services:
  - type: web
    name: uyimiz-backend
    runtime: docker          # mavjud servis Docker'da yaratilgan
    dockerfilePath: ./Dockerfile
    plan: starter            # bepul sinov uchun: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    # Start komanda Dockerfile'dagi entrypoint.sh (migrate → gunicorn)

    envVars:
      # ── Baza: yuqoridagi uyimiz-db dan avtomatik olinadi ──
      - key: DATABASE_URL
        fromDatabase:
          name: uyimiz-db
          property: connectionString

      # ── Django ──
      - key: DJANGO_SECRET_KEY
        generateValue: true      # Render o'zi xavfsiz kalit yaratadi
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_DB_SSL
        value: "0"               # Render'ning ichki ulanishi uchun SSL shart emas
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: DJANGO_ALLOWED_HOSTS
        value: uyimiz-backend.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://uyimiz-backend.onrender.com

      # ── CORS: frontend domenlaringizni yozing ──
      - key: CORS_ALLOW_ALL
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        value: https://uyimiz.uz,https://admin.uyimiz.uz

      # ── Media (S3-mos object storage) ──
      # Qiymatlarni Dashboard → Environment → Secret sifatida kiriting.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: auto
